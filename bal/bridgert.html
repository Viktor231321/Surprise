<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вісник сезону — таємниця однієї леді</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Marck+Script&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --pink:#E8C9CE; --cream:#F7F0E5; --blue:#B9CADB; --wine:#57283D; --gold:#C5A15B; --brown:#49352D; --gold2:#f0dba6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; } html { height:100%; }
  body {
    font-family:"Cormorant Garamond", Georgia, "Times New Roman", serif; font-weight:600; font-size:19px; color:var(--cream);
    min-height:100dvh; display:flex; overflow-x:hidden;
    padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
    background:radial-gradient(ellipse at 50% -10%, #6b3450 0%, #3a1a2a 55%, #20101c 100%) fixed;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .bg { position:fixed; inset:0; z-index:-1; pointer-events:none; transition:opacity 1.6s; }
  #bgNight { background:radial-gradient(ellipse at 50% 0%, #56688f 0%, #2e2646 42%, transparent 80%); opacity:1; }
  #bgWarm  { background:radial-gradient(ellipse at 50% 100%, rgba(255,172,84,.5), rgba(255,150,70,.12) 55%, transparent 80%); opacity:0; }
  body.warm #bgWarm { opacity:1; }
  canvas#conf { position:fixed; inset:0; pointer-events:none; z-index:50; }

  /* частинки */
  .petal { position:fixed; top:-30px; width:12px; height:16px; border-radius:70% 0 70% 0; background:linear-gradient(135deg,#eca0b1,#b4344d); opacity:.75; pointer-events:none; z-index:1; animation:petal linear forwards; }
  @keyframes petal { to { transform:translate(var(--sw),114vh) rotate(560deg); opacity:.25; } }
  .gp { position:fixed; width:var(--s); height:var(--s); border-radius:50%; background:radial-gradient(circle,#fff6cf,#c5a15b); box-shadow:0 0 9px #ffd98a; pointer-events:none; z-index:70; transform:translate(-50%,-50%); animation:gp .9s ease-out forwards; }
  @keyframes gp { to { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))); opacity:0; } }
  .shard { position:fixed; z-index:70; pointer-events:none; background:linear-gradient(135deg,#d9566c,#7d1c33); clip-path:polygon(10% 0,100% 25%,80% 100%,0 70%); transform:translate(-50%,-50%); animation:shard 1s cubic-bezier(.3,.6,.6,1) forwards; }
  @keyframes shard { to { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)); opacity:0; } }

  /* картка-сцена */
  .card { position:relative; margin:auto; width:min(100%,460px); min-height:min(700px,92dvh); padding:54px 22px 30px; display:flex; flex-direction:column; justify-content:center;
          background:linear-gradient(165deg, rgba(87,40,61,.93), rgba(36,16,30,.96)); border:1px solid var(--gold); border-radius:16px;
          box-shadow:0 30px 90px rgba(0,0,0,.65), 0 0 70px rgba(197,161,91,.12), inset 0 0 70px rgba(0,0,0,.35); transition:box-shadow 1.4s; }
  .card::before { content:""; position:absolute; inset:7px; border:1px solid rgba(197,161,91,.38); border-radius:11px; pointer-events:none; }
  body.warm .card { box-shadow:0 30px 90px rgba(0,0,0,.6), 0 0 130px rgba(255,180,90,.4), inset 0 0 90px rgba(255,170,70,.12); }
  .cn { position:absolute; width:22px; height:22px; border:2px solid var(--gold); pointer-events:none; opacity:.9; }
  .cn.tl { top:13px; left:13px; border-right:0; border-bottom:0; border-top-left-radius:10px; } .cn.tr { top:13px; right:13px; border-left:0; border-bottom:0; border-top-right-radius:10px; }
  .cn.bl { bottom:13px; left:13px; border-right:0; border-top:0; border-bottom-left-radius:10px; } .cn.br { bottom:13px; right:13px; border-left:0; border-top:0; border-bottom-right-radius:10px; }
  .dots { position:absolute; top:21px; left:0; right:0; display:flex; gap:8px; justify-content:center; opacity:0; transition:opacity .4s; }
  .dots.on { opacity:1; } .dots i { width:7px; height:7px; transform:rotate(45deg); border:1px solid var(--gold); transition:background .4s; } .dots i.done { background:var(--gold); }

  .screen { display:none; flex-direction:column; align-items:center; text-align:center; gap:16px; }
  .screen.active { display:flex; }
  .screen.active > * { animation:enter .8s cubic-bezier(.2,1,.4,1) both; animation-delay:calc(var(--i,0) * 90ms); }
  @keyframes enter { from { opacity:0; transform:translateY(14px); } }
  h1, h2 { font-family:"Playfair Display", Georgia, serif; font-weight:700; margin:0; color:var(--gold2); text-shadow:0 2px 14px rgba(0,0,0,.5); line-height:1.2; }
  h1 { font-size:25px; letter-spacing:.02em; }
  p { margin:0; line-height:1.4; }
  .kicker { font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); opacity:.95; }
  .sub { font-style:italic; font-size:18px; color:var(--pink); opacity:.95; }
  .hint { font-style:italic; font-size:17px; opacity:.9; color:var(--pink); }

  .btn { font-family:"Playfair Display", Georgia, serif; font-weight:700; font-size:16px; letter-spacing:.04em; color:var(--wine); background:linear-gradient(#f0dba6,#c5a15b); border:0; border-radius:4px;
         padding:13px 26px; cursor:pointer; box-shadow:0 8px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.55); transition:transform .15s, opacity .3s; touch-action:manipulation; }
  .btn:active { transform:scale(.95); } .btn:disabled { opacity:.4; pointer-events:none; filter:grayscale(.4); }
  .btn.out { background:transparent; color:var(--gold2); border:1px solid var(--gold); box-shadow:none; font-size:15px; padding:11px 18px; letter-spacing:.02em; }

  /* воскова печатка */
  .wax { position:relative; border-radius:50%; background:radial-gradient(circle at 35% 30%, #e0566b, #98233a 62%, #6e1527); color:var(--gold2); display:flex; align-items:center; justify-content:center;
         box-shadow:0 8px 18px rgba(0,0,0,.5), inset 0 -5px 9px rgba(0,0,0,.35), inset 0 3px 5px rgba(255,255,255,.28); }
  .wax::before { content:""; position:absolute; inset:9%; border-radius:50%; border:2px solid rgba(240,219,166,.5); box-shadow:inset 0 0 6px rgba(0,0,0,.35); }
  .wax span { text-shadow:0 1px 2px rgba(0,0,0,.6); }

  /* 1. конверт */
  .env0 { position:relative; width:min(300px,84%); height:190px; margin:92px auto 8px; perspective:800px; }
  .env0 > div { position:absolute; }
  .letterpeek { left:9%; right:9%; top:8%; height:88%; z-index:1; background:linear-gradient(#fffaf0,#f1e5c5); border-radius:4px; box-shadow:0 4px 14px rgba(0,0,0,.25); padding-top:16px; color:#b4344d; font-size:22px;
                display:flex; justify-content:center; align-items:flex-start; transition:transform 1.1s .5s cubic-bezier(.3,1.15,.4,1); }
  .front { inset:0; z-index:2; border-radius:6px; background:linear-gradient(160deg,#faf3e4,#e9d9b8); box-shadow:0 18px 40px rgba(0,0,0,.6); }
  .front::after { content:""; position:absolute; inset:0; border-radius:6px; background:linear-gradient(to top right,transparent 49.6%,rgba(120,80,30,.28) 50%,transparent 50.7%), linear-gradient(to top left,transparent 49.6%,rgba(120,80,30,.28) 50%,transparent 50.7%); }
  .flap { left:0; right:0; top:0; height:60%; z-index:3; background:linear-gradient(#efe0bd,#dcc592); clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:top; transition:transform .9s cubic-bezier(.4,.1,.3,1), z-index 0s .45s; }
  .env0.open .flap { transform:rotateX(180deg); z-index:0; } .env0.open .letterpeek { transform:translateY(-52%); z-index:4; }
  .seal { position:absolute; left:50%; top:60%; width:76px; height:76px; margin:-38px 0 0 -38px; z-index:5; border:0; padding:0; cursor:pointer; touch-action:none; font-size:28px; --s:1; }
  .seal span { display:block; transform:scale(var(--s)); pointer-events:none; }
  .seal svg { position:absolute; inset:-10px; width:96px; height:96px; transform:rotate(-90deg); pointer-events:none; filter:drop-shadow(0 0 5px rgba(240,219,166,.6)); }
  .seal .track { fill:none; stroke:rgba(240,219,166,.28); stroke-width:3; } .seal .prog { fill:none; stroke:#f0dba6; stroke-width:4; stroke-linecap:round; }
  .env0.broken .seal { display:none; }
  #invite { font-size:20px; max-width:330px; }

  /* 2. хроніка */
  .news { width:100%; background:linear-gradient(#faf4e6,#efe3cb); color:var(--brown); padding:18px 18px 22px; border:1px solid rgba(73,53,45,.4); box-shadow:0 16px 40px rgba(0,0,0,.55), inset 0 0 50px rgba(150,100,40,.18); position:relative; text-align:left; }
  .news::before { content:""; position:absolute; inset:5px; border:1px solid rgba(73,53,45,.28); pointer-events:none; }
  .mast { font-family:"Playfair Display", Georgia, serif; font-weight:700; font-size:29px; letter-spacing:.06em; text-align:center; color:var(--wine); }
  .rule { border-top:3px double var(--brown); margin:7px 0; } .rule.thin { border-top-width:1px; }
  .issue { display:flex; justify-content:space-between; gap:8px; font-size:13px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; }
  .hl { font-family:"Playfair Display", Georgia, serif; font-weight:700; font-size:21px; line-height:1.2; text-align:center; margin:12px 0 10px; color:var(--brown); text-shadow:none; }
  .nb p { font-size:19.5px; line-height:1.42; margin:0 0 11px; text-align:left; font-weight:600; }
  .nb p:first-child::first-letter { font-family:"Playfair Display", Georgia, serif; font-size:46px; float:left; line-height:.85; padding:4px 7px 0 0; color:var(--wine); font-weight:700; }
  .ln { opacity:0; transform:translateY(8px); filter:blur(3px); transition:opacity .9s, transform .9s, filter .9s; }
  .ln.show { opacity:1; transform:none; filter:none; }
  .nm { font-family:"Marck Script", cursive; font-weight:400; font-size:50px; line-height:1.1; text-align:center; color:var(--wine); margin:2px 0 8px !important; text-shadow:0 0 18px rgba(197,161,91,.55); }
  .nb .after { text-align:center; font-style:italic; font-weight:700; }
  .nb .sg { font-family:"Marck Script", cursive; font-weight:400; text-align:right; font-size:22px; line-height:1.2; color:var(--wine); margin:6px 0 0; }

  /* 3. три таємниці */
  .gl { width:100%; display:flex; flex-direction:column; gap:12px; }
  .ghead { width:100%; display:flex; align-items:center; gap:14px; font:inherit; font-family:"Playfair Display", Georgia, serif; font-weight:500; font-size:16.5px; text-align:left; line-height:1.25; color:var(--gold2);
           background:rgba(197,161,91,.1); border:1px solid rgba(197,161,91,.6); border-radius:6px; padding:12px 14px; cursor:pointer; touch-action:manipulation; transition:background .25s; }
  .ghead:active { background:rgba(197,161,91,.24); }
  .mini { position:relative; flex:0 0 58px; height:42px; perspective:300px; }
  .mini .b { position:absolute; inset:0; border-radius:3px; background:linear-gradient(160deg,#faf3e4,#e0cda3); box-shadow:0 4px 10px rgba(0,0,0,.4); }
  .mini .fl { position:absolute; left:0; right:0; top:0; height:60%; background:linear-gradient(#efe0bd,#d6bd88); clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:top; transition:transform .7s; border-radius:3px 3px 0 0; }
  .mini .wx { position:absolute; left:50%; top:56%; width:17px; height:17px; margin:-8px 0 0 -8px; font-size:8px; transition:opacity .4s, transform .5s; }
  .mini .wx::before { inset:12%; border-width:1px; }
  .gitem.open .mini .fl { transform:rotateX(180deg); } .gitem.open .mini .wx { opacity:0; transform:scale(.3) rotate(40deg); }
  .ghead .st { margin-left:auto; flex:0 0 auto; font-family:"Cormorant Garamond", serif; font-size:14px; font-style:italic; opacity:.8; }
  .gitem.open .ghead .st { color:#bfe2b5; opacity:1; }
  .gbody { display:grid; grid-template-rows:0fr; transition:grid-template-rows .7s ease; } .gitem.open .gbody { grid-template-rows:1fr; } .gbody > div { overflow:hidden; }
  .paper { width:100%; background:radial-gradient(circle at 30% 15%,#fdf6e5,#efe1c3); color:var(--brown); border-radius:5px; padding:18px 18px; box-shadow:0 14px 34px rgba(0,0,0,.5), inset 0 0 44px rgba(150,100,40,.2); text-align:center; }
  .gbody .paper { margin-top:10px; } .gbody .paper p { font-size:20px; font-weight:700; line-height:1.4; }

  /* 4. бальна зала */
  .hall { position:relative; width:100%; height:300px; border-radius:8px; overflow:hidden; border:1px solid rgba(197,161,91,.55); background:linear-gradient(#1d1630,#3a1a2e 70%,#4d2238); box-shadow:inset 0 0 60px rgba(0,0,0,.6); transition:filter 1.6s; --k:1; }
  body.warm .hall { filter:brightness(1.3) saturate(1.15); }
  .wins { position:absolute; left:0; right:0; top:36px; display:flex; justify-content:space-around; padding:0 6%; }
  .wins i { width:19%; height:150px; border-radius:999px 999px 0 0; border:2px solid var(--gold); background:linear-gradient(#34457a,#161c3d); box-shadow:inset 0 0 22px rgba(0,0,0,.55); transition:background 1.6s; }
  body.warm .wins i { background:linear-gradient(#ffb869,#8a4a2c); }
  .chand { position:absolute; top:0; width:118px; height:104px; }
  .chand.l { left:5%; } .chand.r { right:5%; } .chand .fl { fill:#ffe9b0; opacity:.3; transition:opacity 1.4s, filter 1.4s; } body.warm .chand .fl { opacity:1; filter:drop-shadow(0 0 5px #ffcf7a); }
  .floor { position:absolute; left:-30%; right:-30%; bottom:-14%; height:58%; background:repeating-conic-gradient(#2c1424 0 25%, #5b2b44 0 50%) 0 0/64px 64px; transform:perspective(230px) rotateX(58deg); transform-origin:50% 100%; opacity:.85; }
  .rose { position:absolute; bottom:6px; font-size:30px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)); } .rose.l { left:8px; transform:rotate(-14deg); } .rose.r { right:8px; transform:rotate(14deg) scaleX(-1); }
  .candles { position:absolute; left:50%; bottom:20px; transform:translateX(-50%); display:flex; align-items:flex-end; gap:6px; padding:12px 8px 0; border-bottom:7px solid #b8923f; border-radius:0 0 6px 6px; background:linear-gradient(transparent,rgba(197,161,91,.1)); }
  .candle { background:none; border:0; padding:6px 6px 0; cursor:pointer; display:flex; flex-direction:column; align-items:center; touch-action:manipulation; }
  .flame { width:15px; height:28px; border-radius:50% 50% 50% 50% / 62% 62% 38% 38%; transform:scale(0); transform-origin:50% 100%; transition:transform .5s cubic-bezier(.3,1.8,.5,1);
           background:radial-gradient(ellipse at 50% 72%,#fffbd8,#ffc84e 55%,#ff8a2a); box-shadow:0 0 22px 8px rgba(255,190,80,.65); }
  .wick { width:2px; height:9px; background:#3a2a22; }
  .wax2 { width:26px; border-radius:5px 5px 2px 2px; background:linear-gradient(90deg,#efe0b8,#fff8e2 45%,#e6d3a0); box-shadow:inset 0 0 8px rgba(140,100,40,.35); }
  .candle.lit .flame { transform:scale(1); animation:flick 1.5s ease-in-out infinite .5s; } @keyframes flick { 50% { transform:scale(1.08,.93) rotate(2deg); } }
  .candle:not(.lit) { animation:nudge 2.4s ease-in-out infinite; } @keyframes nudge { 50% { transform:translateY(-3px); } }
  #cCount { font-family:"Playfair Display", Georgia, serif; font-size:16px; color:var(--gold2); letter-spacing:.05em; }
  #ballDone { display:none; flex-direction:column; align-items:center; gap:12px; width:100%; }
  #ballDone .done { font-family:"Marck Script", cursive; font-size:34px; color:var(--gold2); line-height:1.1; text-shadow:0 0 18px rgba(255,200,120,.6); }

  /* 5. карти */
  .fan { display:flex; gap:12px; justify-content:center; width:100%; margin:14px 0 8px; }
  .tc { width:29%; max-width:104px; aspect-ratio:2/3.1; perspective:800px; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation; transition:opacity .6s, filter .6s; animation:nudge 2.6s ease-in-out infinite; position:relative; }
  .tc:nth-child(2) { animation-delay:.4s; } .tc:nth-child(3) { animation-delay:.8s; }
  .tc .in { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform 1s cubic-bezier(.3,1.2,.4,1); }
  .tc.flip { animation:none; z-index:3; } .tc.flip .in { transform:rotateY(180deg) scale(1.22); }
  .tc.dim { opacity:.32; filter:blur(.5px); pointer-events:none; animation:none; }
  .face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; box-shadow:0 12px 26px rgba(0,0,0,.55); }
  .face.fr { background:repeating-linear-gradient(45deg,#6b2c47 0 7px,#57283D 7px 14px); border:2px solid var(--gold); } .face.fr::before { content:""; position:absolute; inset:6px; border:1px solid rgba(197,161,91,.75); border-radius:5px; }
  .face.fr svg { width:70%; height:auto; filter:drop-shadow(0 0 6px rgba(240,219,166,.7)); }
  .face.bk { transform:rotateY(180deg); background:radial-gradient(circle at 30% 15%,#fdf6e5,#efe1c3); color:var(--brown); border:2px solid var(--gold); padding:6px; text-align:center; }
  .face.bk span { font-size:34px; } .face.bk small { font-size:12px; font-weight:700; line-height:1.15; font-family:"Playfair Display", serif; }
  #prophecy { margin-top:18px; } #prophecy h2 { color:var(--wine); font-size:21px; text-shadow:none; } #prophecy p { font-size:20px; font-weight:700; margin-top:8px; }
  .orn { color:#a07a30; letter-spacing:.5em; font-size:13px; margin:3px 0; }

  /* 6. лист */
  .letter { position:relative; width:100%; background:radial-gradient(circle at 30% 12%,#fdf7e8,#efe2c4); color:var(--brown); padding:30px 22px 70px; text-align:left; border:2px solid var(--gold); box-shadow:0 18px 44px rgba(0,0,0,.6), inset 0 0 60px rgba(150,100,40,.2); }
  .letter::before { content:""; position:absolute; inset:6px; border:1px solid rgba(197,161,91,.8); pointer-events:none; }
  .letter .rs { position:absolute; top:-12px; right:-8px; font-size:44px; transform:rotate(18deg); filter:drop-shadow(0 6px 6px rgba(0,0,0,.4)); }
  .letter .gr { font-family:"Marck Script", cursive; font-weight:400; font-size:34px; line-height:1.1; color:var(--wine); margin-bottom:10px; }
  .letter p { font-size:20px; font-weight:600; line-height:1.45; margin:0 0 12px; }
  .letter .ls { font-family:"Marck Script", cursive; font-size:24px; line-height:1.25; color:var(--wine); text-align:right; margin-top:10px; }
  .letter .wax { position:absolute; left:50%; bottom:-22px; width:62px; height:62px; margin-left:-31px; font-size:22px; }
  #ask { display:none; flex-direction:column; align-items:center; gap:14px; width:100%; margin-top:24px; }
  #ask .q { font-family:"Playfair Display", serif; font-size:19px; color:var(--gold2); }
  .reply { display:flex; flex-direction:column; gap:10px; width:100%; align-items:center; } .reply .btn { width:min(100%,320px); }
  #thanks { display:none; font-family:"Marck Script", cursive; font-size:26px; line-height:1.3; color:var(--gold2); }

  /* музика */
  #mus { position:fixed; right:max(12px,env(safe-area-inset-right)); bottom:max(12px,env(safe-area-inset-bottom)); z-index:80; width:44px; height:44px; border-radius:50%; display:none; align-items:center; justify-content:center;
         font-size:20px; cursor:pointer; background:rgba(36,16,30,.85); border:1px solid var(--gold); color:var(--gold2); touch-action:manipulation; }

  @media (min-width:700px) { .card { width:540px; padding:52px 40px 38px; min-height:min(780px,92dvh); } h1 { font-size:29px; } body { font-size:21px; } .nb p, .letter p { font-size:21px; } .hall { height:330px; } }
  @media (max-height:700px) { .env0 { height:150px; margin-top:104px; } .hall { height:250px; --k:.8; } .wins i { height:110px; } }
  @media (max-width:360px) { h1 { font-size:22px; } .mast { font-size:25px; } .nb p, .letter p { font-size:18px; } .face.bk small { font-size:11px; } }
</style>
</head>
<body>
<div class="bg" id="bgNight"></div><div class="bg" id="bgWarm"></div>
<canvas id="conf"></canvas>
<button id="mus" aria-label="музика">🎵</button>

<main class="card" id="card">
  <i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <!-- 1. Таємниче запрошення -->
  <section class="screen active" id="s0">
    <p class="kicker" id="s0title"></p>
    <h1 id="s0k"></h1>
    <div class="env0" id="env0">
      <div class="letterpeek">♥</div>
      <div class="front"></div>
      <div class="flap"></div>
      <button class="seal wax" id="seal" aria-label="печатка">
        <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle class="prog" id="ring" cx="50" cy="50" r="44"/></svg>
        <span>♥</span>
      </button>
    </div>
    <p id="invite"></p>
    <p class="hint" id="hint0"></p>
  </section>

  <!-- 2. Світська хроніка -->
  <section class="screen" id="s1">
    <div class="news">

}
function noise(d, f, v, q = 1){

  const s = c.createBufferSource(); s.buffer = buf; const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
  const g = c.createGain(); g.gain.value = v; s.connect(bp); bp.connect(g); g.connect(c.destination); s.start();
}

  on:false, el:null, timer:null, next:0, bar:0, master:null,
  start(){
    if (CONFIG.musicFile){
      if (!this.el){ this.el = new Audio(CONFIG.musicFile); this.el.loop = true; this.el.volume = .5; }
      this.el.play().catch(() => {}); this.on = true; return true;
    }

    if (!this.master){
      this.master = c.createGain(); this.master.gain.value = .6; const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400;
      const d = c.createDelay(); d.delayTime.value = .34; const fb = c.createGain(); fb.gain.value = .3;

const conf = $("conf"), cctx = conf.getContext("2d"); let parts = [];

const setP = p => { ring.style.strokeDashoffset = C*(1-p); seal.style.setProperty("--s", 1 + p*.3); };
function holdLoop(t){ if (holdAt === null) return; const p = Math.min(1, (t - holdAt)/1300); setP(p); if (p >= 1) return sealDone(); raf = requestAnimationFrame(holdLoop); }
seal.addEventListener("pointerdown", e => { if (sealed) return; e.preventDefault(); ac(); seal.setPointerCapture(e.pointerId); ring.style.transition = "none"; holdAt = performance.now(); raf = requestAnimationFrame(holdLoop); });
["pointerup","pointercancel"].forEach(ev => seal.addEventListener(ev, () => { if (sealed) return; holdAt = null; cancelAnimationFrame(raf); ring.style.transition = "stroke-dashoffset .35s"; setP(0); }));
seal.addEventListener("contextmenu", e => e.preventDefault());
async function sealDone(){
  sealed = true; holdAt = null; vib([30,20,60]); sfx.wax(); waxCrack(seal); $("env0").classList.add("broken"); notify("Вона зламала печатку й відкрила лист 💌");
  await sleep(420); $("env0").classList.add("open"); sfx.paper();
  await sleep(1100); sfx.bell(); burst(90); const r = $("env0").getBoundingClientRect(); goldAt(r.left + r.width/2, r.top, 22);
  await sleep(1700); show("s1");
}

/* ---------- 2. хроніка ---------- */
(function buildNews(){
  const nb = $("nb"); let h = "";
  CONFIG.s2.paragraphs.forEach(t => { h += `<p class="ln" data-w="1250">${T(t)}</p>`; });
  h += `<p class="ln pre" data-w="1500">${T(CONFIG.s2.beforeName)}</p>`;
  h += `<p class="ln nm" data-w="2300">${CONFIG.name}</p>`;
  h += `<p class="ln after" data-w="1500">${T(CONFIG.s2.after)}</p>`;
  h += `<p class="ln sg" data-w="1200">${T(CONFIG.s2.sign)}</p>`;
  nb.innerHTML = h;
})();
let newsRan = false;
async function runNews(){
  if (newsRan) return; newsRan = true; await wait(700);
  for (const el of document.querySelectorAll("#nb .ln")){
    await wait(+el.dataset.w); el.classList.add("show"); sfx.tick();
    if (el.classList.contains("nm")){ const r = el.getBoundingClientRect(); goldAt(r.left + r.width/2, r.top + r.height/2, 26); sfx.bell(); }
    el.scrollIntoView({ behavior:"smooth", block:"center" });
  }
  await wait(900); const b = $("n1"); b.style.visibility = "visible"; b.style.animation = "enter .8s both"; b.scrollIntoView({ behavior:"smooth", block:"nearest" });
}
$("n1").onclick = () => show("s2");

/* ---------- 3. три таємниці ---------- */
let opened = 0;
CONFIG.s3.letters.forEach(l => {
  const d = document.createElement("div"); d.className = "gitem";
  d.innerHTML = `<button class="ghead"><span class="mini"><i class="b"></i><i class="fl"></i><i class="wax wx"><span>♥</span></i></span><span>${l.t}</span><span class="st">${CONFIG.s3.open}</span></button>
    <div class="gbody"><div><div class="paper"><p>${T(l.m)}</p></div></div></div>`;
  d.querySelector(".ghead").onclick = e => {
    if (d.classList.contains("open")) return; d.classList.add("open"); d.querySelector(".st").textContent = CONFIG.s3.read; sfx.paper(); vib(20);
    goldAt(e.clientX, e.clientY, 12);
    if (++opened === CONFIG.s3.letters.length){ setTimeout(() => { $("n2").disabled = false; sfx.bell(); $("n2").scrollIntoView({ behavior:"smooth", block:"nearest" }); }, 800); }
  };
  $("gl").appendChild(d);
});
$("n2").onclick = () => show("s3");

/* ---------- 4. бал ---------- */
let lit = 0; const H = [78,98,118,98,78], N = H.length;
$("cCount").textContent = `${CONFIG.s4.count} 0 / ${N}`;
H.forEach(h => {
  const c = document.createElement("button"); c.className = "candle"; c.setAttribute("aria-label","свічка");
  c.innerHTML = `<i class="flame"></i><i class="wick"></i><i class="wax2" style="height:calc(${h}px * var(--k))"></i>`;
  c.onclick = e => {
    if (c.classList.contains("lit")) return; c.classList.add("lit"); lit++; vib(15); sfx.flame(); goldAt(e.clientX, e.clientY - 20, 10);
    $("cCount").textContent = `${CONFIG.s4.count} ${lit} / ${N}`;
    if (lit === N) ballStart();
  };
  $("candles").appendChild(c);
});
function ballStart(){
  document.body.classList.add("warm"); burst(130); sfx.bell(); $("cHint").style.display = "none"; notify("Вона запалила всі свічки 🕯️");
  setTimeout(() => { const b = $("ballDone"); b.style.display = "flex"; b.style.animation = "enter .8s both"; b.scrollIntoView({ behavior:"smooth", block:"nearest" }); }, 800);
}
$("musBtn").onclick = () => setMusic(!Music.on);
$("mus").onclick = () => setMusic(!Music.on);
$("n3").onclick = () => show("s4");

/* ---------- 5. карти долі ---------- */
const roman = ["I","II","III"]; let picked = false;
const ornament = `<svg viewBox="0 0 60 90" fill="none" stroke="#f0dba6" stroke-width="1.5"><circle cx="30" cy="45" r="15"/><circle cx="30" cy="45" r="8"/><path d="M30 18v54M3 45h54M11 26l38 38M49 26L11 64"/><path d="M30 6l4 5-4 5-4-5zM30 74l4 5-4 5-4-5z" fill="#f0dba6"/></svg>`;
CONFIG.s5.cards.forEach((c,i) => {
  const b = document.createElement("button"); b.className = "tc"; b.setAttribute("aria-label","карта");
  b.innerHTML = `<div class="in"><div class="face fr">${ornament}</div><div class="face bk"><span>${c.e}</span><small>${c.t}</small></div></div>`;
  b.onclick = e => {
    if (picked) return; picked = true; b.classList.add("flip"); sfx.flip(); vib(25);
    document.querySelectorAll(".tc").forEach(o => { if (o !== b) o.classList.add("dim"); }); goldAt(e.clientX, e.clientY, 16);
    setTimeout(() => {
      const pr = $("prophecy"); pr.innerHTML = `<h2>${c.t}</h2><div class="orn">✦ ✦ ✦</div><p>${T(c.m)}</p>`; pr.style.display = "block"; pr.style.animation = "enter .9s both";
      const r = pr.getBoundingClientRect(); goldAt(r.left + r.width/2, r.top, 30); sfx.bell(); burst(60);
      const n = $("n4"); n.style.display = ""; n.style.animation = "enter .8s .4s both"; n.scrollIntoView({ behavior:"smooth", block:"nearest" });
    }, 1000);
    notify("Вона обрала карту долі: " + c.t + " 🔮");
  };
  $("fan").appendChild(b);
});
$("n4").onclick = () => show("s5");

/* ---------- 6. лист ---------- */
(function buildLetter(){
  $("lgr").textContent = T(CONFIG.s6.greeting);
  $("lbody").innerHTML = CONFIG.s6.paragraphs.map(t => `<p class="ln" data-w="1500">${T(t)}</p>`).join("");
  $("lsign").innerHTML = CONFIG.s6.sign.map(t => `<div class="ln" data-w="1100">${T(t)}</div>`).join("");
  $("reply").innerHTML = "";
  CONFIG.s6.replies.forEach(r => { const b = document.createElement("button"); b.className = "btn out"; b.textContent = r.b; b.onclick = () => answer(r.m); $("reply").appendChild(b); });
})();
let letterRan = false;
async function runLetter(){
  if (letterRan) return; letterRan = true; notify("Вона відкрила фінальний лист 🌹"); await wait(1000);
  for (const el of document.querySelectorAll("#lbody .ln, #lsign .ln")){ await wait(+el.dataset.w); el.classList.add("show"); sfx.tick(); el.scrollIntoView({ behavior:"smooth", block:"center" }); }
  await wait(900); sfx.bell(); burst(170); const r = $("letter").getBoundingClientRect(); goldAt(r.left + r.width/2, r.top + r.height/2, 40);
  await wait(900); const a = $("ask"); a.style.display = "flex"; a.style.animation = "enter .9s both"; a.scrollIntoView({ behavior:"smooth", block:"end" });
  setInterval(() => { if (!document.hidden && Math.random() < .5) burst(14); }, 2600);
}
function answer(txt){
  notify("Її відповідь: " + txt);
  if (CONFIG.contact){
    const t = encodeURIComponent(txt);
    location.href = CONFIG.channel === "whatsapp" ? `https://wa.me/${CONFIG.contact}?text=${t}` : `https://t.me/${CONFIG.contact}?text=${t}`;
  } else {
    $("reply").style.display = "none"; $("askq").style.display = "none"; const th = $("thanks"); th.style.display = "block"; th.style.animation = "enter .9s both"; burst(100); sfx.bell();
  }
}
$("restart").onclick = () => location.reload();
</script>
</body>
</html>
