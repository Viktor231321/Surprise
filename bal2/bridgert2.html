<style>
  :root { --navy:#17243A; --night:#101827; --wine:#54283D; --silver:#C8CCD8; --champ:#D7BC83; --cream:#F6EBDD; --lilac:#A9A0C2; }

  p { margin:0; line-height:1.42; }

  /* ---------- каркас сцен ---------- */
  .scene { position:fixed; inset:0; display:none; overflow:hidden; background:#0b1222; transition:transform 1s ease-in; }
  .scene.on { display:block; animation:scIn 2s cubic-bezier(.2,.7,.2,1) both; }
  .scene.out { transform:scale(1.1); }
  @keyframes scIn { from { opacity:0; transform:scale(1.06); } to { opacity:1; transform:none; } }
  .bgl { position:absolute; inset:0; overflow:hidden; }
  .scene.on .bgl { animation:kb 45s ease-in-out infinite alternate; }
  @keyframes kb { to { transform:scale(1.07); } }
  .sc { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; display:flex;
        padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left)); }
  .wrap { margin:auto; width:min(100%,540px); display:flex; flex-direction:column; gap:16px; position:relative; }

         background:rgba(16,24,39,.82); border:1px solid rgba(200,204,216,.5); color:var(--silver); font-size:18px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  canvas#conf { position:fixed; inset:0; pointer-events:none; z-index:55; }

         background:linear-gradient(90deg,rgba(200,204,216,.06),rgba(200,204,216,.2),rgba(200,204,216,.06)); background-color:rgba(10,16,30,.62); font-family:"Playfair Display", Georgia, serif; font-weight:500; font-size:13px; letter-spacing:.14em; text-transform:uppercase;
         box-shadow:0 0 22px rgba(169,160,194,.28), inset 0 0 14px rgba(200,204,216,.12); transition:transform .2s; }

  .moon::before { content:""; position:absolute; inset:0; border-radius:50%;
          background:radial-gradient(circle at 30% 40%,rgba(120,110,90,.26) 0 8%,transparent 9%), radial-gradient(circle at 62% 30%,rgba(120,110,90,.2) 0 6%,transparent 7%),
                     radial-gradient(circle at 55% 68%,rgba(120,110,90,.22) 0 10%,transparent 11%), radial-gradient(circle at 25% 70%,rgba(120,110,90,.18) 0 5%,transparent 6%); }

  @keyframes petal { to { transform:translate(var(--sw),114vh) rotate(560deg); opacity:.2; } }

  .seal::after { content:""; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg, rgba(255,255,255,.95) calc(var(--p) * 360deg), rgba(255,255,255,0) 0); }
  .seal span { position:relative; z-index:1; pointer-events:none; }
  .env.broken .seal { display:none; }
  .lp { display:none; position:relative; align-self:stretch; background:linear-gradient(160deg,#fbf3e2,#eadcc0); color:#1f2c46; padding:28px 22px 24px; border-radius:3px; text-align:left; transform-origin:50% 0;
        font-family:"Marck Script", cursive; font-weight:400; font-size:22px; line-height:1.45; box-shadow:0 24px 50px rgba(0,0,0,.65), inset 0 0 40px rgba(120,90,40,.2); }
  .lp::before { content:""; position:absolute; inset:7px; border:1px solid rgba(23,36,58,.28); pointer-events:none; }

  .lp p { margin:0 0 12px; min-height:1px; } .lp .sg { color:var(--wine); text-align:right; margin-top:6px; } .lp .ps { font-family:"Cormorant Garamond",serif; font-style:italic; font-size:17px; font-weight:600; color:#54607e; border-top:1px solid rgba(23,36,58,.25); padding-top:10px; }

  .lp .cta { margin-top:12px; color:#17243A; border-color:rgba(23,36,58,.6); background:linear-gradient(90deg,rgba(23,36,58,.04),rgba(23,36,58,.14),rgba(23,36,58,.04)); background-color:transparent; box-shadow:none; }
  .lp .cta::after { background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent); }

  /* ---------- ЕТАП 2: архівний документ ---------- */

  /* ---------- ЕТАП 3: розслідування ---------- */
  #s2 .bgl { background:radial-gradient(ellipse at 50% 0%,rgba(255,200,130,.32),transparent 55%), linear-gradient(#150d12,#0b080b); }
  #s2 .books { position:absolute; left:0; right:0; top:0; height:46%; display:flex; flex-direction:column; justify-content:space-around; opacity:.8; }

  .dr1 { animation:spk 2.6s ease-in-out infinite; } @keyframes spk { 50% { opacity:.35; } }
  .floor2 { position:absolute; left:-40%; right:-40%; bottom:0; height:36%; background:repeating-conic-gradient(#c9ccd8 0 25%,#1a2236 0 50%) 0 0/86px 86px; transform:perspective(320px) rotateX(63deg); transform-origin:50% 100%; opacity:.55; }
  .floorfx { position:absolute; left:0; right:0; bottom:0; height:30%; background:linear-gradient(transparent,rgba(8,12,24,.7)); }
  .guests { position:absolute; left:0; bottom:27%; width:100%; height:22%; fill:#060a14; opacity:.88; }

  const cols = ["#ffffff","#f3eefa","#d9d3e8","#C8CCD8","#D7BC83","#A9A0C2"];
  for (let i = 0; i < n; i++) parts.push({ k:"p", x:Math.random()*conf.width, y:-20 - Math.random()*conf.height*.4, vx:(Math.random()-.5)*1.6, vy:1.6 + Math.random()*2.8, g:0, life:1, dec:0,

}
function firework(x, y){
  const cols = ["#D7BC83","#C8CCD8","#fff","#A9A0C2","#e9b4c8"], n = 54;
  for (let i = 0; i < n; i++){ const a = i/n*6.28 + Math.random()*.1, sp = 1.4 + Math.random()*3.4;
    parts.push({ k:"f", x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, g:.045, life:1, dec:.012 + Math.random()*.008, r:1.6 + Math.random()*1.8, c:cols[i % cols.length] }); }
  kick();
}
function kick(){ if (!running){ running = true; requestAnimationFrame(frame); } }
function frame(){
  cctx.clearRect(0, 0, conf.width, conf.height);
  for (const p of parts){
    if (p.k === "p"){ p.x += p.vx + Math.sin(p.y/40); p.y += p.vy; p.a += p.va;
      cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.a); cctx.fillStyle = p.c; cctx.globalAlpha = .9; cctx.beginPath(); cctx.ellipse(0, 0, p.r, p.r*.55, 0, 0, 6.28); cctx.fill(); cctx.restore(); }
    else { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.life -= p.dec; cctx.save(); cctx.globalCompositeOperation = "lighter"; cctx.globalAlpha = Math.max(0, p.life);

  }

}

    await wait(2600); const e = $("dend"); e.style.display = ""; e.classList.add("enter"); sfx.bell(); smooth(e);
    await wait(1700); const n = $("n4"); n.style.display = ""; n.classList.add("enter"); smoothEnd(n);
  };
  $("progs").appendChild(b);
});
function danceFx(st){
  if (RM) return; for (let i = 0; i < 16; i++){ const r = document.createElement("i"); r.className = "rise"; r.style.left = (14 + Math.random()*72) + "%"; r.style.setProperty("--rx", (Math.random()*60-30) + "px"); r.style.animationDelay = (Math.random()*5).toFixed(1) + "s"; st.appendChild(r); }
  const drop = () => { if (!st.isConnected || cur !== 4) return; const p = document.createElement("i"); p.className = "fp"; p.style.left = Math.random()*92 + "%"; const h = st.clientHeight;
    p.style.setProperty("--fx", (Math.random()*60-30) + "px"); p.style.setProperty("--fy", (h*.8 + Math.random()*h*.12) + "px"); p.style.setProperty("--fr", (Math.random()*540) + "deg"); st.appendChild(p); if (st.querySelectorAll(".fp").length > 40) st.querySelector(".fp").remove(); };
  for (let i = 0; i < 14; i++) setTimeout(drop, i*260); const iv = setInterval(() => { if (cur !== 4) return clearInterval(iv); drop(); }, 700); sfx.step();
}
$("n4").onclick = () => go(5);

/* ---------- ЕТАП 6: останній конверт ---------- */
let env5Open = false;
async function openEnv5(){
  if (env5Open) return; env5Open = true; ac(); vib([25,20,50]); sfx.paper(); notify("Вона відкрила останній конверт 🌹"); const e = $("env5"); e.classList.add("open"); e.querySelector(".glowp").style.display = "none";
  [$("s5hint"), $("s5k")].forEach(x => { x.style.transition = "opacity .7s"; x.style.opacity = 0; });
  await sleep(2300); petals(40); sfx.bell(); e.classList.add("gone"); await sleep(850); e.style.display = "none"; $("s5hint").style.display = "none"; $("s5k").style.display = "none";
  const lp = $("lp5"); lp.classList.add("show"); sfx.paper(); await sleep(1500); smooth(lp);
  const box = $("lp5t");
  for (const t of CONFIG.s6.letter){ const p = el("p"); p.style.opacity = 0; p.style.transition = "opacity 1.2s"; p.textContent = T(t); box.appendChild(p); await wait(250); p.style.opacity = 1; sfx.tick(); smooth(p); await wait(2100); }
  const sg = el("p", "sg2", CONFIG.s6.sign); sg.style.opacity = 0; sg.style.transition = "opacity 1.4s"; box.appendChild(sg); await wait(250); sg.style.opacity = 1; sfx.bell(); smooth(sg);
  await wait(1700); const b = $("n5"); b.style.display = ""; b.classList.add("enter"); smoothEnd(b);
}
$("env5").onclick = openEnv5; $("env5").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnv5(); } };
$("n5").onclick = () => go(6);

/* ---------- ЕТАП 7: фінал ---------- */
function chatLink(text){
  const t = encodeURIComponent(text);
  if (CONFIG.telegram) return `https://t.me/${String(CONFIG.telegram).replace(/^@/, "")}?text=${t}`;
  if (CONFIG.whatsapp) return `https://wa.me/${String(CONFIG.whatsapp).replace(/\D/g, "")}?text=${t}`;
  return "";
}
let finalRan = false;
function runFinal(){ if (finalRan) return; finalRan = true; petals(50); setTimeout(() => fireworks(2), 800); }
CONFIG.s7.options.forEach(o => {
  const b = document.createElement("button"); b.className = "opt"; b.style.setProperty("--c", o.c); b.textContent = T(o.b);
  b.onclick = async () => {
    if ($("opts").classList.contains("done")) return; $("opts").classList.add("done"); ac(); vib([30,20,60]); sfx.bell();
    document.querySelectorAll(".opt").forEach(x => { x.style.transition = "opacity .8s"; if (x !== b) x.style.opacity = .22; x.style.pointerEvents = "none"; });
    fireworks(7); petals(70); notify("Її відповідь: " + o.b);
    await wait(900); const link = chatLink(T(o.b)); const ans = $("ans"); $("ans1").textContent = T(link ? o.a : o.a); $("ans2").textContent = "— " + T(CONFIG.author); ans.classList.add("show"); smooth(ans);
    if (!link){ $("ans1").textContent = T(o.a) + " " + T(CONFIG.s7.thanks); }
    await wait(1800); const oc = $("openchat"); if (link){ oc.href = link; oc.style.display = "inline-block"; oc.classList.add("enter"); setTimeout(() => { location.href = link; }, 1800 * (RM ? .2 : 1)); }
    await wait(1200); const e = $("s6e"); e.style.display = ""; e.classList.add("enter"); const r = $("restart"); r.style.display = ""; r.classList.add("enter"); smoothEnd(r);
  };
  $("opts").appendChild(b);
});
$("restart").onclick = () => location.reload();

/* ---------- старт ---------- */
(function init(){ SC.forEach(id => $(id).classList.remove("on")); cur = 0; $("s0").classList.add("on"); $("prog").children[0].classList.add("on"); })();
</script>
